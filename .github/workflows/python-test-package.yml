# Continuous integration

name: Test the Python Package

on:
  pull_request:  {}
  workflow_dispatch:
  push:
      branches: [ main ]

permissions:
  contents: read

jobs:
  run_tests:
    # Keep older Python versions available while testing newer ones on latest.
    runs-on: ${{ (matrix.python-version == '3.9' || matrix.python-version == '3.11') && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {gammapy-version: "1.1", python-version: "3.11"}
          - {gammapy-version: "1.2", python-version: "3.11"}
          - {gammapy-version: "1.3", python-version: "3.11"}
          - {gammapy-version: "1.3", python-version: "3.13"}
          - {gammapy-version: "2.0", python-version: "3.11"}
          - {gammapy-version: "2.0", python-version: "3.13"}
          - {gammapy-version: "2.1", python-version: "3.11"}
          - {gammapy-version: "2.1", python-version: "3.12"}
          - {gammapy-version: "2.1", python-version: "3.13"}
          - {gammapy-version: "2.2rc1", python-version: "3.12", gammapy-data-version: "2.1"}
          - {gammapy-version: "2.2rc1", python-version: "3.13", gammapy-data-version: "2.1"}
          - {gammapy-version: "2.2rc1", python-version: "3.14", gammapy-data-version: "2.1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies, download test data, install package and run test
        run: |
          # Set constrain (to obtain the expected version for dependency at the time of installation)
          export PIP_CONSTRAINT="$RUNNER_TEMP/baccmod-constraints.txt"
          printf '%s\n' 'gammapy==${{ matrix.gammapy-version }}' > "$PIP_CONSTRAINT"
          
          case "${{ matrix.gammapy-version }}" in
            1.2|1.3|2.0|2.1) printf '%s\n' 'regions<0.12' >> "$PIP_CONSTRAINT" ;;
          esac
          
          if [ "${{ matrix.gammapy-version }}" = "1.1" ]; then
            printf '%s\n' 'setuptools<82' 'astropy==5.3.4' 'numpy==1.23.5' 'scipy==1.9.3' 'regions<0.11' 'matplotlib<3.9' >> "$PIP_CONSTRAINT"
          elif [ "${{ matrix.gammapy-version }}" = "1.2" ]; then
            printf '%s\n' 'astropy==6.0.1' 'matplotlib==3.8' >> "$PIP_CONSTRAINT"
          fi

          python -m pip install --upgrade pip wheel pytest
          python -m pip install --upgrade setuptools

          python -m pip install gammapy==${{ matrix.gammapy-version }}
          git clone --depth 1 --branch v${{ matrix.gammapy-data-version || matrix.gammapy-version }} https://github.com/gammapy/gammapy-data
          export GAMMAPY_DATA=$PWD/gammapy-data/
          python -m pip install .
          python -m pip check
          python -m pip list
          python -c "import sys; print(\"Python version : \", sys.version)"
          python -c "import gammapy; print(\"gammapy version : \", gammapy.__version__)"
          python -c "import astropy; print(\"astropy version : \", astropy.__version__)"
          python -c "import numpy; print(\"numpy version : \", numpy.__version__)"
          python -c "import scipy; print(\"scipy version : \", scipy.__version__)"
          python -c "import iminuit; print(\"iminuit version : \", iminuit.__version__)"
          python -c "import regions; print(\"regions version : \", regions.__version__)"
          pytest
